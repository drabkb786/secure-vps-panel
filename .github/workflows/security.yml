name: Security and syntax checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest zxing-cpp pillow numpy 'wsproto==1.3.2' 'h11==0.16.0' 'websockets==16.0' 'paramiko==3.5.1' cfn-lint
      - name: Python compile
        run: python -m py_compile src/*.py
      - name: Unit tests
        run: pytest -q
      - name: Validate generated AWS CloudFormation
        run: |
          PYTHONPATH=src python -c 'import json, cdn_manager; print(json.dumps(cdn_manager.template()))' > "$RUNNER_TEMP/cloudfront.json"
          cfn-lint -t "$RUNNER_TEMP/cloudfront.json"
      - name: Dependency-free static audit
        run: python scripts/static-audit.py
      - name: Bash syntax
        run: bash -n install.sh menu.sh scripts/*.sh scripts/tunnel-shell
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dashboard JavaScript syntax
        run: node --check src/web/app.js
      - name: Dashboard mutation result regressions
        run: node --test tests/test_web_client.js tests/test_cloudfront_routes.js
      - name: Install checksum-verified official Xray core
        run: |
          sudo mkdir -p /usr/local/lib/abdulbasit
          sudo bash scripts/install-xray.sh
      - name: Install Nginx for gateway integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx openssh-server
      - name: Real Xray config and Nginx TLS / WS / XHTTP transport tests
        env:
          XRAY_TEST_BINARY: /usr/local/lib/abdulbasit/xray
          NGINX_TEST_BINARY: /usr/sbin/nginx
        run: pytest -q tests/test_nginx.py tests/test_xray_core.py
      - name: Build verified official Dropbear and test SSH through Nginx
        run: |
          bash scripts/fetch-test-dropbear.sh "$RUNNER_TEMP/noway-dropbear"
          DROPBEAR_TEST_BINARY="$RUNNER_TEMP/noway-dropbear/dropbear-2026.94/dropbear" DROPBEARKEY_TEST_BINARY="$RUNNER_TEMP/noway-dropbear/dropbear-2026.94/dropbearkey" NGINX_TEST_BINARY=/usr/sbin/nginx pytest -q tests/test_dropbear_native.py
      - name: Verify sing-box and Mihomo client exports
        run: |
          python scripts/fetch-test-clients.py --directory "$RUNNER_TEMP/noway-test-clients"
          SINGBOX_TEST_BINARY="$RUNNER_TEMP/noway-test-clients/singbox" MIHOMO_TEST_BINARY="$RUNNER_TEMP/noway-test-clients/mihomo" pytest -q tests/test_client_formats.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build pinned official dnstt and test real DNS transport
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          export GOBIN="$RUNNER_TEMP/noway-dnstt"
          go install www.bamsoftware.com/git/dnstt.git/dnstt-server@v1.20260501.0 www.bamsoftware.com/git/dnstt.git/dnstt-client@v1.20260501.0
          DNSTT_TEST_SERVER="$GOBIN/dnstt-server" DNSTT_TEST_CLIENT="$GOBIN/dnstt-client" pytest -q tests/test_slowdns.py
      - name: Fresh panel and SlowDNS startup with production systemd sandbox
        run: sudo env GITHUB_ACTIONS=true bash scripts/test-paneld-systemd.sh "$RUNNER_TEMP/noway-dnstt/dnstt-server"
      - name: Full OpenSSH installer and managed tunnel acceptance
        run: |
          sudo bash install.sh --non-interactive --with-xray
          sudo -u abdulbasit-web /usr/local/lib/abdulbasit/python -c 'import wsproto,h11; assert wsproto.__version__ == "1.3.2" and h11.__version__ == "0.16.0"; assert "/abdulbasit/vendor/" in wsproto.__file__'
          sudo env GITHUB_ACTIONS=true OPENSSH_NATIVE_SYSTEMD=1 "$pythonLocation/bin/python" -m pytest -q tests/test_openssh_native.py
      - name: Reject common committed secrets and unsafe subprocess shells
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git '[0-9]{6,12}:[A-Za-z0-9_-]{30,80}' .
          ! grep -RInE --include='*.py' 'shell[[:space:]]*=[[:space:]]*True' src
          ! grep -RInE --include='*.sh' 'chmod[[:space:]]+777' .

  managed-runtime:
    # Compile once for the PR and again after merge, instead of duplicating the
    # same source build on every feature-branch push and pull_request event.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install panel with supported OS runtime first
        run: |
          sudo bash install.sh --non-interactive --with-xray
          sudo -u abdulbasit-web /usr/local/lib/abdulbasit/python -c 'import wsproto,h11; assert wsproto.__version__ == "1.3.2" and h11.__version__ == "0.16.0"; assert "/abdulbasit/vendor/" in wsproto.__file__'
          # No-domain installs leave a preinstalled/inactive Nginx unchanged.
          # Start it explicitly so acceptance verifies a live service round-trip.
          sudo systemctl start nginx
          sha256sum /usr/bin/python3 /usr/bin/openssl /usr/sbin/sshd /usr/sbin/nginx /usr/bin/certbot /usr/bin/fail2ban-server > "$RUNNER_TEMP/os-binaries.sha256"
      - name: Build and activate pinned private runtime
        run: |
          # Hosted runners make /opt writable to their runner user. The runtime
          # deliberately refuses writable interpreter ancestors on a real VPS.
          sudo chmod 0755 /opt
          sudo install -d -o root -g root -m 0755 /opt/noway /opt/noway/runtime
          sudo stat -c '%U:%G %a %n' /opt /opt/noway /opt/noway/runtime
          sudo /usr/bin/python3 scripts/upgrade-runtime.py --apply --jobs 2
      - name: Prepare Python 3.15 test environment outside the production runtime
        run: |
          /opt/noway/runtime/current/bin/python3 -m venv "$RUNNER_TEMP/runtime-qa"
          "$RUNNER_TEMP/runtime-qa/bin/python" -m pip install pytest 'wsproto==1.3.2' 'h11==0.16.0' 'websockets==16.0' 'paramiko==3.5.1' zxing-cpp pillow numpy
      - name: Full unit suite on upgraded Python and OpenSSL
        # These fixtures chown private config once panel service groups exist.
        # Exercise them as root, matching the installed privileged daemon.
        run: 'sudo "$RUNNER_TEMP/runtime-qa/bin/python" -m pytest -q'
      - name: Actual new Nginx, Xray and OpenSSH data transfer
        run: |
          sudo env GITHUB_ACTIONS=true OPENSSH_NATIVE_SYSTEMD=1 NGINX_TEST_BINARY=/opt/noway/runtime/current/bin/nginx XRAY_TEST_BINARY=/usr/local/lib/abdulbasit/xray "$RUNNER_TEMP/runtime-qa/bin/python" -m pytest -q tests/test_nginx.py tests/test_xray_core.py tests/test_openssh_native.py
      - name: Verify rollback, reactivation, jails, renewal command and OS binaries
        run: |
          sudo env GITHUB_ACTIONS=true NOWAY_RUNTIME_NATIVE=1 "$RUNNER_TEMP/runtime-qa/bin/python" -m pytest -q tests/test_runtime_native.py
          sha256sum --check "$RUNNER_TEMP/os-binaries.sha256"
      - name: Runtime versions and service health
        run: |
          /usr/bin/python3 scripts/upgrade-runtime.py --status
          sudo abdulbasit-security-check
      - name: Build failure details
        if: failure()
        run: |
          sudo find /opt/noway/runtime -name build.log -exec tail -n 70 {} \;
          sudo journalctl -u nginx -u fail2ban -u abdulbasit-paneld -u abdulbasit-ws -u abdulbasit-web -n 65 --no-pager
