name: Security and syntax checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Python compile
        run: python -m py_compile src/*.py
      - name: Unit tests
        run: pytest -q
      - name: Dependency-free static audit
        run: python scripts/static-audit.py
      - name: Bash syntax
        run: bash -n install.sh menu.sh scripts/security-check.sh
      - name: Reject common committed secrets and unsafe subprocess shells
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git '[0-9]{6,12}:[A-Za-z0-9_-]{30,80}' .
          ! grep -RInE --include='*.py' 'shell[[:space:]]*=[[:space:]]*True' src
          ! grep -RInE --include='*.sh' 'chmod[[:space:]]+777' .
